name: nexuspoint_pos
description: NexusPoint Tablet POS - Offline-first point of sale system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Local Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.3

  # Models & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1

  # API Client
  dio: ^5.4.0
  # retrofit: ^4.0.0  # Will add when creating API service (Task 7)
  pretty_dio_logger: ^1.3.0

  # Bluetooth Printing
  flutter_blue_plus: ^1.30.0
  esc_pos_utils: ^1.1.0
  image: ^3.3.0

  # Utilities
  connectivity_plus: ^5.0.0
  shared_preferences: ^2.2.0
  intl: ^0.18.0
  uuid: ^4.0.0
  crypto: ^3.0.3
  device_info_plus: ^9.1.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  drift_dev: ^2.14.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  # retrofit_generator: ^7.0.0  # Will add when creating API service (Task 7)

  # Testing
  mockito: ^5.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
